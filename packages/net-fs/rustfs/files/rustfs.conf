# Environment of the rustfs service, see https://docs.rustfs.com/ for all the
# RUSTFS_* variables.

# Credentials of the root user: without them, rustfs uses rustfsadmin/rustfsadmin
#RUSTFS_ACCESS_KEY=
#RUSTFS_SECRET_KEY=

# Storage, one or several directories owned by the rustfs user
RUSTFS_VOLUMES=/var/lib/rustfs/data

# S3 API
RUSTFS_ADDRESS=:9000

# Web console, when built with the console option
RUSTFS_CONSOLE_ENABLE=true
RUSTFS_CONSOLE_ADDRESS=:9001
